# Opt-in overlay: docker compose -f compose.yaml -f compose.aniyomi.yaml up -d --build
# Create the private token first (see docs/DEPLOYMENT.md).
services:
  moa:
    environment:
      MOA_APK_URL: http://moa-apk:8797
      MOA_APK_SECRET_FILE: /run/secrets/apk-token
    secrets: [apk-token]
    depends_on:
      moa-apk: {condition: service_healthy}
  moa-apk:
    image: ghcr.io/sidetool/moa-apk:${MOA_VERSION:-latest}
    pull_policy: always
    build:
      context: .
      dockerfile: deploy/aniyomi/Dockerfile
    command: [node, server.mjs]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 192
    tmpfs: ["/tmp:rw,size=128m"]
    volumes: [moa-apk-data:/data]
    secrets: [apk-token]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const fs=require('node:fs');fetch('http://127.0.0.1:8797/rpc',{method:'POST',headers:{Authorization:'Bearer '+fs.readFileSync('/run/secrets/apk-token','utf8').trim(),'Content-Type':'application/json'},body:JSON.stringify({method:'status'})}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # No host port and no gateway/tunnel route. MOA is the only API client.
secrets:
  apk-token:
    file: ${MOA_APK_TOKEN_FILE:-./data/apk-config/token}
volumes:
  moa-apk-data:
