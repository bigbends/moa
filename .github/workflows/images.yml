name: Container images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: moa
            platforms: linux/amd64,linux/arm64
            context: .
            file: Dockerfile
          - image: moa-auth
            platforms: linux/amd64,linux/arm64
            context: deploy/auth
            file: deploy/auth/Dockerfile
          - image: moa-connector
            platforms: linux/amd64,linux/arm64
            context: services/connector
            file: services/connector/Dockerfile
          - image: moa-apk
            platforms: linux/amd64,linux/arm64
            context: .
            file: deploy/aniyomi/Dockerfile
          - image: moa-source-browser
            platforms: linux/amd64
            context: .
            file: deploy/source-browser/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: MOA_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
