# Optional locally managed Cloudflare tunnel. Both files are deployer-owned.
services:
  moa-tunnel:
    image: cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    user: "${TUNNEL_UID:-1000}:${TUNNEL_GID:-1000}"
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ${CF_TUNNEL_CONFIG_FILE:-./deploy/local/cloudflared/config.yml}:/etc/cloudflared/config.yml:ro
      - ${CF_TUNNEL_CREDENTIALS_FILE:-./deploy/local/cloudflared/tunnel.json}:/etc/cloudflared/tunnel.json:ro
    depends_on: [moa-gateway]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
