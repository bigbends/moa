services:
  moa:
    build: .
    container_name: moa
    init: true
    ports:
      - "${MOA_BIND_ADDRESS:-127.0.0.1}:${MOA_PORT:-8795}:8795"
    environment:
      MOA_REQUIRE_ACCOUNT: "1"
      MOA_MAX_TRANSCODES: "${MOA_MAX_TRANSCODES:-2}"
      MOA_TMDB_TOKEN: ${MOA_TMDB_TOKEN:-}
      MOA_TMDB_API_KEY: ${MOA_TMDB_API_KEY:-}
    volumes:
      - ./data:/data
      - ${MEDIA_PATH:-/srv/media}:${MEDIA_CONTAINER_PATH:-/media/library}:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8795/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  moa-auth:
    build: ./deploy/auth
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8796}
    volumes:
      - ./data/auth/config:/config:ro
      - ./data/auth/sessions:/data
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  moa-gateway:
    image: nginx:1.27-alpine
    ports:
      - "${MOA_BIND_ADDRESS:-127.0.0.1}:${MOA_GATEWAY_PORT:-8796}:8080"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      GATEWAY_CLIENT_IP: ${GATEWAY_CLIENT_IP:-$$remote_addr}
      NGINX_ENVSUBST_FILTER: "^(PUBLIC_HOST|PUBLIC_SCHEME|GATEWAY_CLIENT_IP)$$"
    volumes:
      - ./deploy/gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      moa: {condition: service_healthy, restart: true}
      moa-auth: {condition: service_healthy, restart: true}
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
